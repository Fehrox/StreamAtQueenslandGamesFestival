name: Deploy to GitHub Pages

on:
  push:
    branches: [remote-deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Twitch client ID
        env:
          PUBLIC_TWITCH_CLIENT_ID: ${{ vars.PUBLIC_TWITCH_CLIENT_ID || secrets.PUBLIC_TWITCH_CLIENT_ID }}
        run: |
          if [ -z "$PUBLIC_TWITCH_CLIENT_ID" ]; then
            echo "::error::Set PUBLIC_TWITCH_CLIENT_ID as a GitHub Actions repository variable or secret."
            exit 1
          fi

      - name: Build Astro site
        env:
          PUBLIC_TWITCH_CLIENT_ID: ${{ vars.PUBLIC_TWITCH_CLIENT_ID || secrets.PUBLIC_TWITCH_CLIENT_ID }}
        run: npm run build

      - name: Disable Jekyll
        run: touch ./dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
